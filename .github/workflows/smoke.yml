name: smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -c constraints.txt
      - name: Smoke test with tiny random models
        run: bash tests/run_smoke.sh /tmp/vec16_smoke
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: |
            /tmp/vec16_smoke/work/small/REPORT.md
            /tmp/vec16_smoke/work/small/assets
          if-no-files-found: ignore
